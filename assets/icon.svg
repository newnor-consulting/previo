<!--
  Previo mark. Favicon and app icon ONLY.

  docs/business/brand-guidelines.md permits the mark here and forbids it on the
  page itself, where the wordmark "Previo." is used instead. This is that one
  permitted use.

  NOTE FOR ANY LATER EDIT OF THIS COMMENT: an XML comment may not contain two
  consecutive hyphens, so CSS custom properties cannot be written here in their
  own syntax. Chrome does not report the parse error; it simply renders nothing,
  and the favicon disappears from every page at once. Name tokens in prose.

  THE TRACE (2026-09-05). This replaces the four-square "P", which said nothing
  about what the company does. The path steps twice and terminates at a node: a
  record followed back to the one source that settles it, which is the argument
  the whole site makes. It is the same idea as the oxblood thread drawn down the
  landing page, at logo scale.

  The geometry comes from an outside kit; everything else is ours. What changed
  in the translation, and why each one matters:

    1. Corner arcs removed, miter joins instead. Nothing in this system has a
       radius, and the arcs were the single detail that made the mark read as a
       different brand. The kit shipped this exact drawing as its own small size
       variant, so the sharp version is the author's, not a guess.
    2. The node takes the teal accent, not the kit's second red. Teal is the one
       accent and it is already the wordmark's full stop, so the node reads as
       the logo's dot rather than a rival to it. Oxblood stays what it is: the
       thread on the landing page and the stamp on the sample report, never the
       logo's colour.
    3. The kit's navy is dropped for the near black we already have. A navy
       would have been a sixth palette value serving one file.

  Built in the house grammar: no gradient, no rounded corners, and only
  canonical palette values, taken from assets/tokens.css (near black, paper,
  teal) so it stays consistent with what check_design_tokens.py pins for CSS.

  The dark tile is deliberate and predates this mark: a light mark on a dark
  ground is legible in a light tab bar and a dark one, which a knockout on
  transparency is not.

  Drawn on a 48 grid at native stroke weight, then placed by the transform
  below, so the stroke stays heavy enough to hold at 16px. Do not tidy the
  transform away by baking it into the path: those numbers are what centre the
  mark optically, a shade above true centre, because the node sits high right.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Previo">
  <rect width="48" height="48" fill="#0c0d0f"/>
  <g transform="translate(2.44,4.28) scale(0.88)">
    <!-- two steps, squared off -->
    <path d="M8 36V25H21V13H27" fill="none" stroke="#fafaf8" stroke-width="6"
          stroke-linejoin="miter" stroke-linecap="butt"/>
    <!-- the node: where the trace ends, in the one accent -->
    <circle cx="38" cy="13" r="6" fill="#0d9488"/>
  </g>
</svg>
